<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
 "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <title>Switch Case: Denda Perpustakaan</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript">
        var sInput;

        sInput = prompt("Pilih ruang: (B)aca, (D)skusi, (K)omputer, (A)udio Visual", "B");

        switch (sInput) {
            case "B":
                alert("Ruang baca di lantai 1");
                break;
            case "D":
                alert("Ruang diskusi di lantai 2");
                break;
            case "K":
                alert("Ruang komputer di lantai 2");
                break;
            case "A":
                alert("Ruang audio visual di lantai 3");
                break;
            default:
                alert("Ruang tidak ditemukan");
        }
    </script>
</head>

<body>
    <h1>Switch Case: Denda Perpustakaan</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>
</html>
